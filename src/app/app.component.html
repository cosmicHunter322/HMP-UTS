<ion-app>
  <ion-menu contentId="main-content" side="start">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>SIMOBILE</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/tabs/dashboard" routerDirection="root">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Beranda</ion-label>
          </ion-item>
          <ion-item routerLink="/pengaturan" routerDirection="root">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
          <ion-item routerLink="/tentang" routerDirection="root">
            <ion-icon slot="start" name="information-circle-outline"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
          <ion-item button (click)="logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
