<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Daftar Produk</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/keranjang">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar [(ngModel)]="searchQuery" placeholder="Cari nama barang..." animated="true"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let p of filteredProducts">
      <ion-thumbnail slot="start" (click)="goToDetail(p.id)" style="cursor: pointer;">
        <img [src]="p.imageUrl || 'assets/shapes.svg'" alt="Produk Gambar" />
      </ion-thumbnail>
      <ion-label (click)="goToDetail(p.id)" style="cursor: pointer;">
        <h2>{{ p.name }}</h2>
        <p>Stok: {{ p.stock }} | Kategori: {{ p.category }}</p>
        <p>Harga: Rp {{ p.sellPrice | number }}</p>
      </ion-label>
      <ion-button slot="end" (click)="addToCart(p)" [disabled]="p.stock <= 0" color="secondary">
        <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/tambah-produk" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
